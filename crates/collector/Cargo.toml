[package]
name = "tracekit-collector"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Local-first TraceKit collector with atomic SQLite ingestion"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "signal", "net", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
uuid = { version = "1.18", features = ["v4"] }
sha2 = "0.10"
regex = "1.12"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3.23"
