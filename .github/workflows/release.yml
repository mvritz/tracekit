name: Package verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tarballs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@v4
        with:
          node-version: 24.0.1
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun pm --cwd packages/protocol pack && bun pm --cwd packages/sdk pack
      - uses: actions/upload-artifact@v4
        with:
          name: tracekit-tarballs
          path: packages/*/*.tgz
          retention-days: 14
