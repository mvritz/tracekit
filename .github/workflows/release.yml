name: Package verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tarballs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.0.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm --dir packages/protocol pack && pnpm --dir packages/sdk pack
      - uses: actions/upload-artifact@v4
        with:
          name: tracekit-tarballs
          path: packages/*/*.tgz
          retention-days: 14
